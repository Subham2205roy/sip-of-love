<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe7ef">
  <meta name="description" content="A little reminder to drink water, with love.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>A Little Sip of Love 💗</title>
</head>
<body>
  <main class="app">
    <div class="top-heart">♡</div>
    <p class="eyebrow">A LITTLE REMINDER FOR MY DORY</p>
    <h1>Hey, Sweaty! <span>💗</span></h1>
    <p class="subtitle">A tiny sip now, a happier you later.</p>

    <section class="glass-card">
      <div class="glass">💧</div>
      <p class="water-count" id="count">0</p>
      <p class="muted">glasses of water today</p>
      <button class="small-button" id="addWater">+ I drank a glass</button>
    </section>

    <section class="settings">
      <label for="interval">Remind me every</label>
      <select id="interval">
        <option value="30">30 minutes</option>
        <option value="45" selected>45 minutes</option>
        <option value="60">60 minutes</option>
      </select>
      <p class="hint">Keep this page open for reminders to run.</p>
    </section>

    <button class="primary" id="start">Turn on my reminders ✨</button>
    <button class="secondary" id="stop" disabled>Pause reminders</button>
    <p class="status" id="status" aria-live="polite">Your little water buddy is waiting 💌</p>
    <p class="footer">Made with a little extra love ♡</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
